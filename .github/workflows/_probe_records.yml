name: 临时-旅行历史只读核查
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WB_REFRESH_TOKEN: ${{ secrets.WB_REFRESH_TOKEN }}
      WB_ACCESS_TOKEN: ${{ secrets.WB_ACCESS_TOKEN }}
      WB_DOMAIN: ${{ secrets.WB_DOMAIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 只读核查
        run: |
          python - <<'PY'
          import sys, json, datetime
          sys.path.insert(0, "scripts")
          import workbuddy_travel as t
          import workbuddy_checkin as w
          token, domain, err = w.resolve_credential({"detail": {}})
          if err or not token:
              print("[核查] 凭据失败:", str(err)[:120]); raise SystemExit(1)
          for path in ("/records", "/status"):
              http, body = t.api(token, path, "GET")
              print("[核查] GET %s HTTP=%s code=%s msg=%s" % (
                  path, http, body.get("code") if isinstance(body, dict) else "?",
                  str(body.get("msg") or "")[:80] if isinstance(body, dict) else ""))
              d = body.get("data") if isinstance(body, dict) else None
              if not isinstance(d, dict):
                  continue
              if path == "/records":
                  recs = d.get("records") or []
                  print("[核查] 历史条数=%s total=%s 字段名=%s" % (
                      len(recs), d.get("total"), sorted(d.keys())))
                  for r in recs[:4]:
                      safe = {}
                      for k in ("id", "state", "reward_credit", "depart_at", "arrive_at", "claimed_at"):
                          if k in r: safe[k] = r[k]
                      loc = r.get("location")
                      if isinstance(loc, dict): safe["location"] = loc.get("name")
                      for k, v in list(safe.items()):
                          if isinstance(v, (int, float)) and v > 10**9:
                              safe[k] = datetime.datetime.utcfromtimestamp(v).strftime("%m-%d %H:%M UTC")
                      print("   ", json.dumps(safe, ensure_ascii=False))
              else:
                  print("[核查] state=%s limit=%s server_now=%s" % (
                      d.get("state"), d.get("daily_limit_reached"), d.get("server_now")))
          PY
