name: WorkBuddy 每日自动签到

# ─────────────────────────────────────────────────────────────
#  WorkBuddy「Buddy 加油站」每日签到 · GitHub Actions 版
#  原理：从仓库 Secrets 读取凭据，直接调用官方签到接口
#       （接口直签，无需 GUI，无需本机常驻）
#
#  双账号（可选功能，单账号部署无需改动）：
#    尾号6717 → WB_REFRESH_TOKEN   / WB_ACCESS_TOKEN   / WB_DOMAIN
#    尾号7100 → WB_REFRESH_TOKEN_2 / WB_ACCESS_TOKEN_2 / WB_DOMAIN_2
#    两个 job 各注入各的凭据，同一次定时运行并行签到，互不干扰。
#    未配置尾号7100 凭据时，「尾号7100」job 会跳过并保持绿色，
#    因此只用一个账号的 Fork 用户不会看到红灯或失败提醒。
#
#  凭据说明（长效令牌优先，适配客户端 5.6.2+）：
#    WB_REFRESH_TOKEN(_2) — 长效令牌，每次运行先换取接口令牌（推荐）
#    WB_ACCESS_TOKEN(_2)  — 短效令牌直通（兼容 5.5.x 及更早）
# ─────────────────────────────────────────────────────────────

on:
  schedule:
    # GitHub Actions 使用 UTC 时间；北京时间 09:00 = UTC 01:00
    # ⚠️ 定时任务在整点前后可能有数分钟~数十分钟延迟，属 GitHub 正常现象
    - cron: '0 1 * * *'
  # 支持在 Actions 页面手动触发（首次配置后建议先手动跑一次验证）
  workflow_dispatch:
    inputs:
      check_only:
        description: '仅查询状态，不执行领取'
        required: false
        default: false
        type: boolean

# 同一时间只保留一个运行实例，避免并发重复领取。
# 尾号6717 / 尾号7100 属于同一次 run 内的两个 job，不受此互斥影响。
concurrency:
  group: workbuddy-checkin
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checkin_a:
    name: 执行签到 · 尾号6717
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # 尾号6717 凭据（脚本自动识别，长效令牌优先）
      WB_REFRESH_TOKEN: ${{ secrets.WB_REFRESH_TOKEN }}
      WB_ACCESS_TOKEN: ${{ secrets.WB_ACCESS_TOKEN }}
      WB_DOMAIN: ${{ secrets.WB_DOMAIN }}
      # 推送与摘要里的账号标识（单账号部署也可留空，不影响原行为）
      WB_ACCOUNT_LABEL: '尾号6717'
      WB_TOKEN_SECRET_NAME: 'WB_REFRESH_TOKEN'
      # 尾号6717 是必跑项；缺凭据应报错告警
      CREDENTIAL_REQUIRED: 'true'
      # 通知通道（两个账号共用，可选，任一为空则跳过该通道）
      WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
      WECOM_APP: ${{ secrets.WECOM_APP }}
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
      BARK_URL: ${{ secrets.BARK_URL }}
      SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
      SUCCESS_NOTIFY: ${{ secrets.SUCCESS_NOTIFY }}

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 检查凭据是否已配置
        id: guard
        run: |
          if [ -n "$WB_REFRESH_TOKEN" ]; then
            echo "✓ 凭据已配置：长效令牌（推荐；内容不外显）"
          elif [ -n "$WB_ACCESS_TOKEN" ]; then
            echo "✓ 凭据已配置：短效令牌直通（内容不外显）"
          elif [ "$CREDENTIAL_REQUIRED" = "true" ]; then
            echo "::error::尾号6717 未配置凭据。请在仓库 Settings → Secrets and variables → Actions 添加「WB_REFRESH_TOKEN」（客户端 5.6.2+ 必用，长效令牌）。"
            exit 1
          else
            echo "::notice::尾号7100 未配置 WB_REFRESH_TOKEN_2 / WB_ACCESS_TOKEN_2，跳过本账号（单账号部署属正常情况）"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 只输出存在性结论，不输出 token 长度 / 内容 / 片段（长度也是可用于指纹识别的信息）
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "✓ 接口域名：${WB_DOMAIN:-（默认 www.codebuddy.cn）}"

      - name: 设置 Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 生成推送配置（可选）
        if: steps.guard.outputs.skip != 'true'
        # 仅在配置了任一通知通道时生效；未配置则静默跳过
        run: |
          python scripts/gen_notify_config.py "$HOME/.workbuddy/scripts/notify_config.json"

      - name: 环境自检（只读）
        if: steps.guard.outputs.skip != 'true'
        run: python scripts/workbuddy_checkin.py --diagnose

      - name: 执行签到
        id: checkin
        if: steps.guard.outputs.skip != 'true'
        # 手动触发且勾选「仅查询」时不执行领取
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.check_only }}" = "true" ]; then
            ARGS="--check-only"
          fi
          # 注意：脚本用非 0 退出码表示签到失败。
          # 管道会吞掉退出码（$? 变成 tee 的），因此这里用 PIPESTATUS 精确取 Python 的退出码，
          # 否则签到失败也会被判为 success，导致失败告警失效。
          set +e
          python scripts/workbuddy_checkin.py $ARGS | tee result.json
          rc=${PIPESTATUS[0]}
          set -e
          echo "checkin_exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit $rc

      - name: 输出运行摘要
        if: ${{ !cancelled() && steps.guard.outputs.skip != 'true' }}
        # 只输出白名单字段，不把完整 result.json 写入摘要
        # （摘要会长期留存于 Actions 页面，应避免暴露原始接口响应全文）
        run: |
          echo "### $WB_ACCOUNT_LABEL 签到结果" >> "$GITHUB_STEP_SUMMARY"
          python scripts/summarize_result.py result.json >> "$GITHUB_STEP_SUMMARY"

      - name: 失败时终止任务（触发 GitHub 失败通知）
        if: ${{ steps.guard.outputs.skip != 'true' && steps.checkin.outcome != 'success' }}
        run: |
          echo "::error::$WB_ACCOUNT_LABEL 签到未成功（退出码 ${{ steps.checkin.outputs.checkin_exit_code }}），请查看上方日志与运行摘要"
          exit 1

  checkin_b:
    name: 执行签到 · 尾号7100
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # 尾号7100 凭据：全部独立一套，避免覆盖尾号6717
      WB_REFRESH_TOKEN: ${{ secrets.WB_REFRESH_TOKEN_2 }}
      WB_ACCESS_TOKEN: ${{ secrets.WB_ACCESS_TOKEN_2 }}
      # 未单独配置域名时回退到尾号6717 的域名（通常两者相同）
      WB_DOMAIN: ${{ secrets.WB_DOMAIN_2 || secrets.WB_DOMAIN }}
      WB_ACCOUNT_LABEL: '尾号7100'
      WB_TOKEN_SECRET_NAME: 'WB_REFRESH_TOKEN_2'
      # 尾号7100 为可选项：未配置凭据则整组步骤跳过
      CREDENTIAL_REQUIRED: 'false'
      WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
      WECOM_APP: ${{ secrets.WECOM_APP }}
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
      BARK_URL: ${{ secrets.BARK_URL }}
      SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
      SUCCESS_NOTIFY: ${{ secrets.SUCCESS_NOTIFY }}

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 检查凭据是否已配置
        id: guard
        run: |
          if [ -n "$WB_REFRESH_TOKEN" ]; then
            echo "✓ 凭据已配置：长效令牌（推荐；内容不外显）"
          elif [ -n "$WB_ACCESS_TOKEN" ]; then
            echo "✓ 凭据已配置：短效令牌直通（内容不外显）"
          elif [ "$CREDENTIAL_REQUIRED" = "true" ]; then
            echo "::error::尾号6717 未配置凭据。请在仓库 Settings → Secrets and variables → Actions 添加「WB_REFRESH_TOKEN」（客户端 5.6.2+ 必用，长效令牌）。"
            exit 1
          else
            echo "::notice::尾号7100 未配置 WB_REFRESH_TOKEN_2 / WB_ACCESS_TOKEN_2，跳过本账号（单账号部署属正常情况）"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 只输出存在性结论，不输出 token 长度 / 内容 / 片段（长度也是可用于指纹识别的信息）
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "✓ 接口域名：${WB_DOMAIN:-（默认 www.codebuddy.cn）}"

      - name: 设置 Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 生成推送配置（可选）
        if: steps.guard.outputs.skip != 'true'
        run: |
          python scripts/gen_notify_config.py "$HOME/.workbuddy/scripts/notify_config.json"

      - name: 环境自检（只读）
        if: steps.guard.outputs.skip != 'true'
        run: python scripts/workbuddy_checkin.py --diagnose

      - name: 执行签到
        id: checkin
        if: steps.guard.outputs.skip != 'true'
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.check_only }}" = "true" ]; then
            ARGS="--check-only"
          fi
          set +e
          python scripts/workbuddy_checkin.py $ARGS | tee result.json
          rc=${PIPESTATUS[0]}
          set -e
          echo "checkin_exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit $rc

      - name: 输出运行摘要
        if: ${{ !cancelled() && steps.guard.outputs.skip != 'true' }}
        run: |
          echo "### $WB_ACCOUNT_LABEL 签到结果" >> "$GITHUB_STEP_SUMMARY"
          python scripts/summarize_result.py result.json >> "$GITHUB_STEP_SUMMARY"

      - name: 失败时终止任务（触发 GitHub 失败通知）
        if: ${{ steps.guard.outputs.skip != 'true' && steps.checkin.outcome != 'success' }}
        run: |
          echo "::error::$WB_ACCOUNT_LABEL 签到未成功（退出码 ${{ steps.checkin.outputs.checkin_exit_code }}），请查看上方日志与运行摘要"
          exit 1
