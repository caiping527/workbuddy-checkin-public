name: 临时-旅行接口只读探测
on:
  workflow_dispatch:
jobs:
  probe_write:
    name: 写接口连通性 · 尾号6717
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WB_REFRESH_TOKEN: ${{ secrets.WB_REFRESH_TOKEN }}
      WB_ACCESS_TOKEN: ${{ secrets.WB_ACCESS_TOKEN }}
      WB_DOMAIN: ${{ secrets.WB_DOMAIN }}
      WB_ACCOUNT_LABEL: '尾号6717'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 探测（只打印脱敏回执）
        run: |
          python - <<'PY'
          import sys, json
          sys.path.insert(0, "scripts")
          import workbuddy_travel as t
          import workbuddy_checkin as w

          token, domain, err = w.resolve_credential({"detail": {}})
          if err or not token:
              print("[探测] 凭据失败:", str(err)[:160]); raise SystemExit(1)
          print("[探测] 接口令牌取得成功（内容不打印）")

          st, e = t.get_status(token)
          print("[探测] 当前状态:", e or ("%s limit=%s rec=%s" % (
              st.get("state"), st.get("daily_limit_reached"), st.get("record_id"))))

          for name, path, payload in (
              ("claim 空body", "/claim", {}),
              ("depart location_id=1", "/depart", {"location_id": 1}),
          ):
              http, body = t.api(token, path, "POST", payload)
              code = body.get("code") if isinstance(body, dict) else "?"
              msg = str((body.get("msg") or body.get("message") or ""))[:120] if isinstance(body, dict) else ""
              data = body.get("data") if isinstance(body, dict) else None
              safe = {}
              if isinstance(data, dict):
                  for k in ("state", "record_id", "reward_credit", "arrive_at", "daily_limit_reached"):
                      if k in data: safe[k] = data[k]
                  if isinstance(data.get("location"), dict):
                      safe["location_name"] = data["location"].get("name")
              print("[探测] %-24s HTTP=%s code=%s msg=%s data=%s" % (
                  name, http, code, msg, json.dumps(safe, ensure_ascii=False)))

          st2, e2 = t.get_status(token)
          print("[探测] 结束后状态:", e2 or ("%s limit=%s arrive=%s now=%s" % (
              st2.get("state"), st2.get("daily_limit_reached"),
              st2.get("arrive_at"), st2.get("server_now"))))
          PY
