name: 临时-旅行接口只读探测
on:
  workflow_dispatch:
jobs:
  probe_a:
    name: 只读 · 尾号6717
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WB_REFRESH_TOKEN: ${{ secrets.WB_REFRESH_TOKEN }}
      WB_ACCESS_TOKEN: ${{ secrets.WB_ACCESS_TOKEN }}
      WB_DOMAIN: ${{ secrets.WB_DOMAIN }}
      WB_ACCOUNT_LABEL: '尾号6717'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/workbuddy_travel.py --status

  probe_b:
    name: 只读 · 尾号7100
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WB_REFRESH_TOKEN: ${{ secrets.WB_REFRESH_TOKEN_2 }}
      WB_ACCESS_TOKEN: ${{ secrets.WB_ACCESS_TOKEN_2 }}
      WB_DOMAIN: ${{ secrets.WB_DOMAIN_2 || secrets.WB_DOMAIN }}
      WB_ACCOUNT_LABEL: '尾号7100'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/workbuddy_travel.py --status

  probe_extra:
    name: 只读 · 尾号4060
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: acct-4060
    env:
      WB_REFRESH_TOKEN: ${{ secrets.WB_REFRESH_TOKEN }}
      WB_ACCESS_TOKEN: ${{ secrets.WB_ACCESS_TOKEN }}
      WB_DOMAIN: ${{ secrets.WB_DOMAIN }}
      WB_ACCOUNT_LABEL: '尾号4060'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/workbuddy_travel.py --status
