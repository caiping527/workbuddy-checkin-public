name: Qoder 每日自动领取

# ─────────────────────────────────────────────────────────────
#  Qoder CN「每天领 100 Credits」· GitHub Actions 版
#  原理：读仓库 Secret 里的凭据，直接调官方活动平台接口
#       （接口直签，不用开客户端、不用本机常驻）
#
#  账号体系沿用 WorkBuddy 签到同一套做法：
#
#  ① 固定 job（仓库级 Secret，单账号 Fork 直接可用）
#    主账号 → QODER_ACCESS_TOKEN / QODER_REFRESH_TOKEN / QODER_UID
#
#  ② 动态 job（Environment 级 Secret，用于「随便再加账号」）
#    仓库变量 QODER_ACCOUNTS 里列出的账号编号（逗号分隔，如 "8f2f291a,1234abcd"），
#    每个编号对应一个 Environment `qoder-<编号>`，环境内存放与仓库级**同名**的
#    QODER_ACCESS_TOKEN / QODER_REFRESH_TOKEN / QODER_UID。
#    job 通过 `environment: qoder-<编号>` 取用，环境级 Secret 覆盖仓库级同名值，
#    因此各账号互不干扰。新增账号只需在本机 AiRoute 登录该号后跑一次同步工具：
#    工具自动建 Environment、写令牌、把编号追加进 QODER_ACCOUNTS，
#    不需要改本文件、也不需要去网页手动加 Secret。
#
#  ⚠️ 一个必须知道的官方限制（不是本项目的 bug）：
#     Qoder 的活动平台按「人」去重 —— 同一台机器/同一个人名下多个账号，
#     当天只有第一个能领到，其余会返回 SAME_PERSON_ALREADY_CLAIMED。
#     所以多账号能不能叠加，取决于这些账号是不是被判定为不同的人。
# ─────────────────────────────────────────────────────────────

on:
  schedule:
    # GitHub Actions 的 cron 用 UTC。Qoder 领取窗口 =「今天 10:00 → 明天 10:00」。
    #
    # 主跑：北京 06:07（= UTC 22:07 前一天）
    #   6 点准点跑时窗口还没开，脚本会明确报「新一轮未开放」并以特殊退出码结束（10），
    #   不会误报成「今天已领过」。
    #
    # 补签：北京 12:37（= UTC 04:37）
    #   这是「10 点前跑过就补一次」的那一班。脚本自己判断：
    #     · 若今天还没领到 → 正常领取
    #     · 若今天已领到   → 直接报「今天已领过」，不做多余请求
    #   所以固定挂在这个点即可，无需额外状态文件。
    - cron: '7 22 * * *'
    - cron: '37 4 * * *'
  workflow_dispatch:
    inputs:
      check_only:
        description: '仅查询状态，不执行领取'
        required: false
        default: false
        type: boolean

concurrency:
  group: qoder-checkin
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ── 读取动态账号列表，生成 matrix ──────────────────────────
  prepare_accounts:
    name: 读取账号列表
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      count: ${{ steps.build.outputs.count }}
    steps:
      - name: 生成动态 matrix
        id: build
        env:
          LIST: ${{ vars.QODER_ACCOUNTS }}
        run: |
          items=""
          n=0
          for t in $(printf '%s' "$LIST" | tr ',' ' '); do
            # 只接受 4~16 位十六进制/字母数字编号，其余（空项、说明文字）忽略
            case "$t" in ''|*[!0-9a-zA-Z]*) continue ;; esac
            [ "${#t}" -ge 4 ] || continue
            [ "${#t}" -le 16 ] || continue
            [ -z "$items" ] || items="$items,"
            items="$items{\"slot\":\"$t\",\"env\":\"qoder-$t\"}"
            n=$((n + 1))
          done
          if [ "$n" -eq 0 ]; then
            echo 'matrix={"include":[{"slot":"none","env":"none"}]}' >> "$GITHUB_OUTPUT"
          else
            echo "matrix={\"include\":[$items]}" >> "$GITHUB_OUTPUT"
          fi
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "动态账号数：$n"

  # ── 主账号（仓库级 Secret） ────────────────────────────────
  checkin_main:
    name: 执行领取 · 主账号
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 检查凭据
        id: guard
        env:
          T: ${{ secrets.QODER_ACCESS_TOKEN }}
          R: ${{ secrets.QODER_REFRESH_TOKEN }}
        run: |
          if [ -n "$T" ] || [ -n "$R" ]; then
            echo "✓ 凭据已配置（内容不外显）"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::未配置凭据。请在 Settings → Secrets and variables → Actions 添加 QODER_ACCESS_TOKEN（或 QODER_REFRESH_TOKEN）。"
            exit 1
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: '3.11'

      - name: 执行领取
        id: checkin
        if: steps.guard.outputs.skip != 'true'
        env:
          QODER_ACCESS_TOKEN: ${{ secrets.QODER_ACCESS_TOKEN }}
          QODER_REFRESH_TOKEN: ${{ secrets.QODER_REFRESH_TOKEN }}
          QODER_UID: ${{ secrets.QODER_UID }}
          QODER_MACHINE_ID: ${{ secrets.QODER_MACHINE_ID }}
          QODER_WECOM_APP: ${{ secrets.QODER_WECOM_APP }}
          QODER_ACCOUNT_LABEL: ${{ vars.QODER_LABEL || 'Qoder 主账号' }}
          QODER_CHECK_ONLY: ${{ (github.event_name == 'workflow_dispatch' && inputs.check_only) && '1' || '0' }}
        run: |
          # 管道会吞掉退出码，用 PIPESTATUS 精确取 Python 的退出码
          set +e
          python qoder/checkin.py | tee run.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          # 10 = 窗口还没开（北京时间 10:00 前）。这不算失败，
          # 让 workflow 正常收尾，等 10:00 后的补签那一班真正领取。
          if [ "$rc" = "10" ]; then
            echo "::notice::当前还没到 10:00 领取窗口，本次只做检查；10:00 后的补签那一班会真正领取。"
            exit 0
          fi
          exit $rc

      - name: 运行摘要
        if: ${{ !cancelled() && steps.guard.outputs.skip != 'true' }}
        run: |
          echo "### Qoder 领取结果" >> "$GITHUB_STEP_SUMMARY"
          python qoder/summarize.py result.json >> "$GITHUB_STEP_SUMMARY"

      - name: 失败时终止任务
        if: ${{ steps.guard.outputs.skip != 'true' && steps.checkin.outcome != 'success' }}
        run: |
          echo "::error::Qoder 领取未成功（退出码 ${{ steps.checkin.outputs.exit_code }}），请查看上方日志"
          exit 1

  # ── 动态账号（Environment 级 Secret） ─────────────────────
  checkin_dynamic:
    name: 执行领取 · ${{ matrix.slot }}
    needs: prepare_accounts
    if: needs.prepare_accounts.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 1        # 串行：上游对连续 claim 有频率判据
      matrix: ${{ fromJSON(needs.prepare_accounts.outputs.matrix) }}
    environment: ${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4

      - name: 检查凭据
        id: guard
        env:
          T: ${{ secrets.QODER_ACCESS_TOKEN }}
          R: ${{ secrets.QODER_REFRESH_TOKEN }}
        run: |
          if [ -n "$T" ] || [ -n "$R" ]; then
            echo "✓ 凭据已配置（内容不外显）"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Environment「${{ matrix.env }}」没有凭据，跳过该账号"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: '3.11'

      - name: 执行领取
        id: checkin
        if: steps.guard.outputs.skip != 'true'
        env:
          QODER_ACCESS_TOKEN: ${{ secrets.QODER_ACCESS_TOKEN }}
          QODER_REFRESH_TOKEN: ${{ secrets.QODER_REFRESH_TOKEN }}
          QODER_UID: ${{ secrets.QODER_UID }}
          QODER_MACHINE_ID: ${{ secrets.QODER_MACHINE_ID }}
          QODER_WECOM_APP: ${{ secrets.QODER_WECOM_APP }}
          QODER_ACCOUNT_LABEL: ${{ matrix.slot }}
          QODER_CHECK_ONLY: ${{ (github.event_name == 'workflow_dispatch' && inputs.check_only) && '1' || '0' }}
        run: |
          set +e
          python qoder/checkin.py | tee run.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" = "10" ]; then
            echo "::notice::${{ matrix.slot }} 还没到 10:00 领取窗口，本次只做检查。"
            exit 0
          fi
          exit $rc

      - name: 运行摘要
        if: ${{ !cancelled() && steps.guard.outputs.skip != 'true' }}
        run: |
          echo "### Qoder 领取结果 · ${{ matrix.slot }}" >> "$GITHUB_STEP_SUMMARY"
          python qoder/summarize.py result.json >> "$GITHUB_STEP_SUMMARY"

      - name: 失败时终止任务
        if: ${{ steps.guard.outputs.skip != 'true' && steps.checkin.outcome != 'success' }}
        run: |
          echo "::error::${{ matrix.slot }} 领取未成功（退出码 ${{ steps.checkin.outputs.exit_code }}）"
          exit 1
